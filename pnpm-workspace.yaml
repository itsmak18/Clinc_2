  '@tanstack/react-query': ^5.101.2
  '@types/node': ^25.3.3
  '@types/react': ^19.2.17
  '@types/react-dom': ^19.2.0
  '@vitejs/plugin-react': ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  framer-motion: ^12.23.24
  lucide-react: ^0.545.0
  react: ^19.1.0
  react-dom: ^19.1.0
  tailwind-merge: ^3.6.0
  tailwindcss: ^4.3.1
  tsx: ^4.22.4
  vite: ^7.3.5
  wouter: ^3.10.0
  zod: ^3.25.76
# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), you can add it to the
# `minimumReleaseAgeExclude` allowlist below. Only consider doing this for
# packages released by trusted organizations with an impeccable security
# posture (e.g. react from Meta, typescript from Microsoft). Even then,
# remove the exclusion once the 1-day window has passed.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

minimumReleaseAgeExclude: []

onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # GHSA-8988-4f7v-96qf OpenTelemetry Core unbounded memory — production OTEL dep (was >=1.30.0)
  "@opentelemetry/core": ">=2.8.0"
  # cookie-signature timing-safe compare — production runtime via cookie-parser
  # (moved from root package.json pnpm.overrides 2026-07-11: when both files declare
  # overrides, package.json wins and this whole block is silently ignored — root
  # cause of the inert esbuild/path-to-regexp/picomatch pins. Root package.json
  # pnpm block removed; this file is now the single source of truth.)
  cookie-signature: "^1.2.2"
  esbuild: "0.27.3"
  # GHSA-q3j6-qgpj-74h6 (path traversal) + GHSA-v39h-62p7-jpjc (host confusion) —
  # dev-only: orval>@scalar/openapi-parser>ajv>fast-uri
  fast-uri: ">=3.1.2"
  # GHSA-hmw2-7cc7-3qxx (CRLF injection) — dev-only: @types/supertest>@types/superagent>form-data
  form-data: ">=4.0.6"
  # GHSA-22p9-wv53-3rq4 (quadratic scan loop) — dev-only: orval>typedoc>markdown-it>linkify-it
  linkify-it: ">=5.0.1"
  # GHSA-r5fr-rjxr-66jc (_.template code injection) — dev-only: testcontainers>archiver>archiver-utils>lodash
  lodash: ">=4.18.0"
  # CVE-2026-41907 / GHSA-w5hq-g745-h8pq (v3/v5/v6 buffer bounds) — production: node-cron>uuid@8.x
  uuid: ">=11.1.1"
  # CVE-2026-33750 (brace-expansion hang/OOM) — brace-expansion <2.0.3
  "minimatch>brace-expansion": ">=2.0.3"
  # GHSA-j3q9-mxjg-w52f (path-to-regexp ReDoS/DoS) — production: express>router uses this
  path-to-regexp: ">=8.4.0"
  # CVE-2026-33671 (ReDoS) + CVE-2026-33672 (method injection) — picomatch <2.3.2 / <4.0.4
  # Blanket override: pnpm intersects with each consumer's range, so micromatch consumers
  # get 2.3.2+ and tinyglobby (^4.x) consumers get 4.0.4+.
  picomatch: ">=2.3.2"
  # GHSA-<qs-dos> qs DoS stringify — production runtime via Express 5/body-parser
  qs: ">=6.15.2"
  # undici multiple HIGH/MOD — dev-only testcontainers dep
  undici: ">=7.28.0"
