# ── Production Docker Compose ─────────────────────────────────────────────────
# DO NOT use `docker-compose.yml` for production deployment. That file is
# dev-friendly (exposed DB ports, default-able secrets). This file enforces
# the hardening required for a real deployment.
#
# Required before `docker compose -f docker-compose.prod.yml up`:
#   1. .env populated from .env.prod.example with strong values
#   2. ./secrets/ files exist (chmod 0600, owned by deploy user):
#        ./secrets/postgres_password
#        ./secrets/app_db_password               — medicore_app role password (NOSUPERUSER NOBYPASSRLS)
#                                                  openssl rand -base64 48 | tr -d '\n' > ./secrets/app_db_password
#        ./secrets/session_secret            — 64 hex chars (HMAC key for device fingerprinting)
#                                              node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#        ./secrets/field_encryption_key      — 64 hex chars (AES-256-GCM; LOSING THIS = TOTAL PHI LOSS)
#                                              node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#                                              Escrow before first prod boot.
#        ./secrets/metrics_token             — opaque token for /metrics bearer auth
#                                              openssl rand -hex 32
#        ./secrets/jwt_private_key           — Ed25519 PKCS8 PEM (signs JWTs; rotate quarterly)
#                                              node -e "const c=require('crypto');const {privateKey}=c.generateKeyPairSync('ed25519',{privateKeyEncoding:{type:'pkcs8',format:'pem'}});process.stdout.write(privateKey)" > ./secrets/jwt_private_key
#        ./secrets/jwt_public_key            — Ed25519 SPKI PEM (advertised via /.well-known/jwks.json)
#                                              node -e "const c=require('crypto');const {publicKey}=c.generateKeyPairSync('ed25519',{publicKeyEncoding:{type:'spki',format:'pem'}});process.stdout.write(publicKey)" > ./secrets/jwt_public_key
#                                              IMPORTANT: jwt_private_key and jwt_public_key must be a matched pair.
#                                              Use the rotation script to generate both atomically: see SECURITY.md §JWT key rotation.
#   3. TLS termination in front of this stack (see Caddy block below or D1 plan item)
#
# Pre-flight validation:
#   docker compose -f docker-compose.prod.yml config            # rejects on missing :? secrets
#   docker compose -f docker-compose.prod.yml --env-file .env config

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    # Pinned by digest for reproducibility + supply-chain integrity (C4).
    # Tag-only references silently update when a registry re-tags `:16-alpine` —
    # which is the supply-chain bug we want to close before a real deployment.
    # POSTGRES_IMAGE must be set in .env to `postgres:16-alpine@sha256:<digest>`;
    # populate the digest from:
    #   docker pull postgres:16-alpine && docker inspect --format='{{index .RepoDigests 0}}' postgres:16-alpine
    # Re-pin on every base-image upgrade and record in CHANGELOG.md.
    image: ${POSTGRES_IMAGE:?POSTGRES_IMAGE required — must include @sha256:<digest> pin}
    restart: always
    environment:
      POSTGRES_DB:            ${POSTGRES_DB:?POSTGRES_DB required}
      POSTGRES_USER:          ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # NO ports: published — postgres reachable only on internal docker network (A4)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 200
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    # Pinned by digest — same rationale as postgres above. Populate via:
    #   docker pull redis:7-alpine && docker inspect --format='{{index .RepoDigests 0}}' redis:7-alpine
    image: ${REDIS_IMAGE:?REDIS_IMAGE required — must include @sha256:<digest> pin}
    restart: always
    entrypoint: ["sh", "-c"]
    command:
      - |
        exec redis-server \
          --requirepass "$$(cat /run/secrets/redis_password)" \
          --save 60 1 \
          --loglevel warning \
          --maxmemory 512mb \
          --maxmemory-policy allkeys-lru
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
    # NO ports: published (A4)
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 768m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── Database migration (run-once init container) ────────────────────────────
  # Ownership split: this container runs as the bootstrap superuser (POSTGRES_USER)
  # which has DDL rights. After migrations, it sets the medicore_app role password
  # from ./secrets/app_db_password (F-01 fix, ADR-008). api + worker then connect
  # as medicore_app (NOSUPERUSER NOBYPASSRLS) so RLS actually enforces.
  # api/worker depend_on this service completing successfully — role existence
  # is guaranteed before the app starts.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    entrypoint: ["sh", "-c"]
    # DATABASE_URL composed at run time so the password file stays out of
    # `docker inspect` output. ${VARS} interpolated by compose at parse time.
    command:
      - |
        set -eu
        export DATABASE_URL="postgresql://${POSTGRES_USER:?POSTGRES_USER required}:$$(cat /run/secrets/postgres_password)@postgres:5432/${POSTGRES_DB:?POSTGRES_DB required}"
        pnpm --filter @workspace/db run db:migrate

        # Set medicore_app password from Docker secret (not committed to SQL).
        # apk is available in the build target image (same pattern as backup service).
        apk add --no-cache postgresql-client > /dev/null 2>&1 || true
        APP_PW="$$(cat /run/secrets/app_db_password)"
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 \
          -c "ALTER ROLE medicore_app LOGIN PASSWORD '$$APP_PW'"
        echo "[migrate] medicore_app password set"

        # Pre-cutover smoke gate: verify medicore_app can connect and is a
        # non-superuser (NOSUPERUSER NOBYPASSRLS). If grants are wrong or the
        # role was somehow created as a superuser, this fails migrate → api/worker
        # never start (cleaner than a crash-loop). See ADR-008-app-db-role.md.
        PGPASSWORD="$$APP_PW" psql \
          "postgresql://medicore_app@postgres:5432/${POSTGRES_DB}" \
          -v ON_ERROR_STOP=1 \
          -c "SELECT current_user, rolsuper::text, rolbypassrls::text FROM pg_roles WHERE rolname = current_user" \
          -c "SELECT 1 FROM patients LIMIT 1"
        echo "[migrate] smoke OK — medicore_app verified non-superuser with SELECT on patients"
    secrets:
      - postgres_password
      - app_db_password
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 512m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── PgBouncer connection pooler ──────────────────────────────────────────────
  # Sits between api/worker and Postgres. Transaction pooling lets api + worker
  # each hold DB_POOL_MAX=40 cheap connections to PgBouncer while PgBouncer
  # maintains only default_pool_size=20 real connections to Postgres — keeping
  # total Postgres connections well below max_connections=100 even with a 2nd
  # api replica. Config template: ./pgbouncer/pgbouncer.ini (see file comments
  # for pool math). See also RUNBOOK §PgBouncer and ADR-009.
  #
  # statement_timeout and idle_in_transaction_session_timeout are enforced via
  # ALTER ROLE medicore_app SET ... (migration 0021) so they survive DISCARD ALL
  # correctly under transaction pooling.
  pgbouncer:
    # Pinned by digest — same rationale as postgres above. Populate via:
    #   docker pull pgbouncer/pgbouncer:1.23.1
    #   docker inspect --format='{{index .RepoDigests 0}}' pgbouncer/pgbouncer:1.23.1
    image: ${PGBOUNCER_IMAGE:?PGBOUNCER_IMAGE required — must include @sha256:<digest> pin}
    restart: always
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        # Build MD5 userlist for medicore_app from the Docker secret.
        # Format: "username" "md5<md5(password + username)>"
        # The MD5 is computed over the concatenation of password + username
        # (Postgres wire-protocol convention).
        APP_PW="$$(cat /run/secrets/app_db_password)"
        HASH=$$(printf '%s' "$${APP_PW}medicore_app" | md5sum | cut -d' ' -f1)
        printf '"medicore_app" "md5%s"\n' "$$HASH" > /tmp/userlist.txt

        # Generate runtime pgbouncer.ini referencing the secret-derived userlist.
        cat > /tmp/pgbouncer.ini <<PGBCONF
        [databases]
        * = host=postgres port=5432

        [pgbouncer]
        listen_port = 6432
        listen_addr = *
        auth_type = md5
        auth_file = /tmp/userlist.txt
        pool_mode = transaction
        default_pool_size = $${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
        reserve_pool_size = 5
        reserve_pool_timeout = 3
        max_client_conn = $${PGBOUNCER_MAX_CLIENT_CONN:-200}
        server_reset_query = DISCARD ALL
        ignore_startup_parameters = extra_float_digits,search_path
        server_connect_timeout = 5
        server_idle_timeout = 600
        client_idle_timeout = 0
        tcp_keepalive = 1
        log_connections = 0
        log_disconnections = 0
        log_pooler_errors = 1
        stats_period = 60
        PGBCONF
        exec pgbouncer /tmp/pgbouncer.ini
    secrets:
      - app_db_password
    environment:
      # Expose pool-size knobs so they can be tuned per-env without rebuilding.
      # default_pool_size: PgBouncer → Postgres connections (the scarce resource).
      #   Raise when adding API replicas; verify Postgres max_connections headroom.
      # max_client_conn: app → PgBouncer connections (cheap). Must exceed
      #   sum of (DB_POOL_MAX × number_of_api_worker_instances).
      PGBOUNCER_DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-20}
      PGBOUNCER_MAX_CLIENT_CONN:   ${PGBOUNCER_MAX_CLIENT_CONN:-200}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # pg_isready speaks the PostgreSQL startup handshake — PgBouncer responds
      # to it without completing auth, making it a reliable liveness probe.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── API Server ───────────────────────────────────────────────────────────────
  # Secret-handling note: SESSION_SECRET, FIELD_ENCRYPTION_KEY, METRICS_TOKEN,
  # JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, and REDIS_PASSWORD are NOT in the
  # `environment:` block — they would be visible to anyone who can run
  # `docker inspect medicore-api`. Instead they live in `./secrets/*` (mode
  # 0600), are mounted at /run/secrets/* by compose, and are read by the
  # entrypoint script below. This way the container sees them but the host's
  # `docker inspect` does not.
  # The legacy JWT_SECRET env var was removed — signing now uses EdDSA via
  # JWT_PRIVATE_KEY/JWT_PUBLIC_KEY. SESSION_SECRET is the HMAC key for
  # device fingerprinting only (lib/device-fingerprint.ts).
  api:
    # Rollback support: pin a tagged image in .env (API_IMAGE=registry/medicore-api:<sha>)
    # for production. Falls back to local build when API_IMAGE is unset. See RUNBOOK.md §1.2.
    image: ${API_IMAGE:-medicore-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV:        production
      PORT:            "5000"
      # DATABASE_URL, SESSION_SECRET, FIELD_ENCRYPTION_KEY, METRICS_TOKEN,
      # JWT_PRIVATE_KEY, JWT_PUBLIC_KEY, and REDIS_URL are all composed/loaded
      # at runtime in the entrypoint script below — keeps values out of
      # `docker inspect` output.
      SESSION_STORE:   redis
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required}
      DB_POOL_MAX:     ${DB_POOL_MAX:-40}
    entrypoint: ["sh", "-c"]
    # ${POSTGRES_USER}/${POSTGRES_DB} interpolated by compose at parse time.
    # $$( ) escapes so command-substitution happens inside the container at run time.
    # `set -eu` makes a missing/empty secret file a hard fail before exec node — the
    # alternative is the process starting with an empty JWT/encryption key.
    command:
      - |
        set -eu
        for s in app_db_password session_secret field_encryption_key metrics_token jwt_private_key jwt_public_key redis_password; do
          test -s "/run/secrets/$$s" || { echo "FATAL: /run/secrets/$$s missing or empty" >&2; exit 1; }
        done
        # Connect as medicore_app (NOSUPERUSER NOBYPASSRLS) so RLS enforces.
        # Route through PgBouncer (transaction pooling) — statement_timeout and
        # idle_in_transaction_session_timeout are set via ALTER ROLE (migration
        # 0021) so they survive DISCARD ALL correctly under transaction pooling.
        export DATABASE_URL="postgresql://medicore_app:$$(cat /run/secrets/app_db_password)@pgbouncer:6432/${POSTGRES_DB}"
        export SESSION_SECRET="$$(cat /run/secrets/session_secret)"
        export FIELD_ENCRYPTION_KEY="$$(cat /run/secrets/field_encryption_key)"
        export METRICS_TOKEN="$$(cat /run/secrets/metrics_token)"
        export JWT_PRIVATE_KEY="$$(cat /run/secrets/jwt_private_key)"
        export JWT_PUBLIC_KEY="$$(cat /run/secrets/jwt_public_key)"
        export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"
        exec node --enable-source-maps dist/index.mjs
    secrets:
      - app_db_password
      - session_secret
      - field_encryption_key
      - metrics_token
      - jwt_private_key
      - jwt_public_key
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    # NO ports: published — api reachable only via clinic (nginx) on internal network
    # Docker's default stop timeout is 10s — far too short for the graceful
    # shutdown sequence (DRAIN_GRACE_MS=3s + SSE_DRAIN_MS=10s + pool drain).
    # stop_grace_period must exceed SHUTDOWN_TIMEOUT_MS (30s) so Docker never
    # SIGKILL mid-drain. Set to 35s for a 5s margin.
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    # C3: read-only rootfs + tmpfs for /tmp; drop all caps
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - frontend

  # ── Background Worker ────────────────────────────────────────────────────────
  worker:
    # Same image as api — single artifact, different entrypoint (worker.mjs).
    # Rollback semantics identical: pin via WORKER_IMAGE (or reuse API_IMAGE).
    image: ${WORKER_IMAGE:-${API_IMAGE:-medicore-api:latest}}
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      NODE_ENV:        production
      SESSION_STORE:   redis
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required}
      DB_POOL_MAX:     ${DB_POOL_MAX:-40}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        for s in app_db_password session_secret field_encryption_key metrics_token jwt_private_key jwt_public_key redis_password; do
          test -s "/run/secrets/$$s" || { echo "FATAL: /run/secrets/$$s missing or empty" >&2; exit 1; }
        done
        # Connect as medicore_app (NOSUPERUSER NOBYPASSRLS) so RLS enforces.
        # Route through PgBouncer — same pool as api but separate DB_POOL_MAX
        # budget. statement_timeout / idle_in_transaction_session_timeout are
        # role-level defaults (migration 0021), pooling-safe.
        export DATABASE_URL="postgresql://medicore_app:$$(cat /run/secrets/app_db_password)@pgbouncer:6432/${POSTGRES_DB}"
        export SESSION_SECRET="$$(cat /run/secrets/session_secret)"
        export FIELD_ENCRYPTION_KEY="$$(cat /run/secrets/field_encryption_key)"
        export METRICS_TOKEN="$$(cat /run/secrets/metrics_token)"
        export JWT_PRIVATE_KEY="$$(cat /run/secrets/jwt_private_key)"
        export JWT_PUBLIC_KEY="$$(cat /run/secrets/jwt_public_key)"
        export REDIS_URL="redis://:$$(cat /run/secrets/redis_password)@redis:6379"
        exec node --enable-source-maps dist/worker.mjs
    secrets:
      - app_db_password
      - session_secret
      - field_encryption_key
      - metrics_token
      - jwt_private_key
      - jwt_public_key
      - redis_password
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
    stop_grace_period: 35s
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    # C3: read-only rootfs + tmpfs for /tmp; drop all caps
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── Clinic Frontend (nginx) ──────────────────────────────────────────────────
  clinic:
    build:
      context: .
      dockerfile: Dockerfile.clinic
    restart: always
    depends_on:
      api:
        condition: service_healthy
    # In prod, clinic is reachable from Caddy/Traefik only (D1).
    # If running without an edge proxy, change to "80:80" — but you then lose TLS.
    expose:
      - "80"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

  # ── Caddy reverse proxy (D1: automatic TLS via Let's Encrypt) ────────────────
  # Supersedes the C5 nginx TLS work. Caddy obtains + renews certs automatically.
  # Requires DNS A/AAAA records pointing CADDY_DOMAIN to this host's public IP.
  # Inbound :80 + :443 must be reachable for HTTP-01 challenge (or use DNS-01
  # by adding a Caddyfile snippet with your DNS provider's plugin).
  caddy:
    # Pinned by digest — same rationale as postgres above. Populate via:
    #   docker pull caddy:2-alpine && docker inspect --format='{{index .RepoDigests 0}}' caddy:2-alpine
    image: ${CADDY_IMAGE:?CADDY_IMAGE required — must include @sha256:<digest> pin}
    restart: always
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?CADDY_DOMAIN required (e.g., clinic.example.com)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      clinic:
        condition: service_started
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - frontend

  # ── Redis Exporter ───────────────────────────────────────────────────────────
  # Exposes Redis metrics on :9121 for the RedisHighMemory alert.
  # Target: the redis service on its internal Docker network address.
  redis_exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: always
    environment:
      REDIS_ADDR: "redis://redis:6379"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - backend
    depends_on:
      - redis

  # ── Node Exporter ────────────────────────────────────────────────────────────
  # Exposes host OS metrics on :9100. Also reads the backup textfile collector
  # directory (/metrics-textfile) where backup-metrics.sh writes backup.prom.
  # Unlocks: DiskSpaceCritical, BackupStale, BackupMissingTextfile alerts.
  #
  # Requires host bind-mounts for proc/sys access (standard node_exporter setup).
  # The textfile-dir volume is shared with the backup container.
  node_exporter:
    image: prom/node-exporter:v1.8.2
    restart: always
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
      - "--collector.textfile.directory=/metrics-textfile"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - backup_metrics:/metrics-textfile:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.1
    pids_limit: 30
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - backend

  # ── Blackbox Exporter ────────────────────────────────────────────────────────
  # Probes external HTTP/HTTPS endpoints. Used for TLS certificate expiry check.
  # Unlocks: SSLCertificateExpiringSoon alert.
  # BLACKBOX_TARGET env var must be set in .env (e.g. https://medicore.example.com).
  blackbox_exporter:
    image: prom/blackbox-exporter:v0.25.0
    restart: always
    command:
      - "--config.file=/etc/blackbox_exporter/config.yml"
    volumes:
      - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    cpus: 0.1
    pids_limit: 20
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    networks:
      - backend

  # ── Prometheus ───────────────────────────────────────────────────────────────
  # Scrapes api + worker /metrics (Bearer-auth via mounted metrics_token secret).
  # No published ports — access via SSH tunnel for ad-hoc queries:
  #   ssh -L 9090:localhost:9090 deploy@host  (then `docker compose exec prometheus ...`)
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: always
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--storage.tsdb.retention.size=5GB"
      - "--web.enable-lifecycle"
    user: "nobody"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/alerts/medicore.yml:ro
      - prometheus_data:/prometheus
    secrets:
      - metrics_token
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── Alertmanager ─────────────────────────────────────────────────────────────
  # Email receiver (chosen 2026-05-31). SMTP config is in alertmanager.yml +
  # the smtp_auth_password secret (F-P6-5) — NOT .env (Alertmanager ignores ${VAR}).
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: always
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.listen-address="
    # F-P6-5 (2026-06-07): Alertmanager does NOT env-expand its config file, so the
    # old `environment: SMTP_*` block + `${VAR}` config was inert (no email ever sent).
    # SMTP non-secret fields are now hardcoded in alertmanager.yml; the password is a
    # Docker secret read via smtp_auth_password_file. No environment block needed.
    secrets:
      - smtp_auth_password
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 50
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── Grafana ──────────────────────────────────────────────────────────────────
  # SSH-tunnel-only access (decision 2026-05-31). NOT exposed via Caddy.
  # To view dashboards:
  #   ssh -L 3000:localhost:3000 deploy@host
  #   (then open http://localhost:3000 on your laptop)
  # Reachable only on the backend network; no port published, no frontend network.
  grafana:
    image: grafana/grafana:11.1.0
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER:           ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password
      GF_USERS_ALLOW_SIGN_UP:           "false"
      GF_AUTH_ANONYMOUS_ENABLED:        "false"
      GF_ANALYTICS_REPORTING_ENABLED:   "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES:   "false"
      GF_SERVER_HTTP_ADDR:              "0.0.0.0"
    secrets:
      - grafana_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    # Published on loopback only — reachable through `ssh -L 3000:localhost:3000`.
    # Do NOT change to "3000:3000" without first adding TLS+auth in front.
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

  # ── Automated DB Backup ──────────────────────────────────────────────────────
  # Daily 02:00 UTC. backup-verify.mjs does pg_dump | gpg --encrypt → verify
  # → rsync over SSH to external server → 30-day retention prune. The script is
  # idempotent — a duplicate 02:00 run is harmless. Quarterly restore drill:
  #   docker compose -f docker-compose.prod.yml exec backup \
  #     node scripts/backup-verify.mjs --restore
  #
  # Prerequisites on host:
  #   - GPG public key for BACKUP_GPG_RECIPIENT imported into ${GNUPG_HOME:-~/.gnupg}
  #   - SSH key at ${BACKUP_SSH_KEY:-./secrets/backup_ssh_key} (mode 0600) authorized
  #     on the offsite server at BACKUP_RSYNC_TARGET (user@host:/path/)
  #   - Run once to seed known_hosts:
  #       ssh -i ./secrets/backup_ssh_key user@offsite.example.com true
  backup:
    image: ${API_IMAGE:-medicore-api:latest}
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    restart: always
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        export DATABASE_URL="postgresql://${POSTGRES_USER}:$$(cat /run/secrets/postgres_password)@postgres:5432/${POSTGRES_DB}"
        # Install gpg + openssh + rsync (image is alpine-based; quick & cached).
        apk add --no-cache gnupg openssh-client rsync >/dev/null 2>&1 || true
        # rsync-over-SSH offsite uploader. {FILE} substituted by backup-verify.mjs.
        # StrictHostKeyChecking=accept-new pins on first use; subsequent mismatches abort.
        if [ -n "$${BACKUP_RSYNC_TARGET:-}" ]; then
          export OFFSITE_UPLOAD_COMMAND="rsync -av -e 'ssh -i /run/secrets/backup_ssh_key -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/root/.ssh/known_hosts' {FILE} $${BACKUP_RSYNC_TARGET}"
        fi
        mkdir -p /root/.ssh && chmod 700 /root/.ssh
        echo "[backup] Scheduled backup at 02:00 UTC daily, retention=$${BACKUP_RETENTION_DAYS}d"
        # Lightweight cron-equivalent. Alpine has no systemd-timer; busybox crond
        # would also work but this keeps the entrypoint single-file + observable.
        LAST_RUN_DAY=""
        while true; do
          CURRENT_DAY=$$(date -u +%Y-%m-%d)
          CURRENT_HOUR=$$(date -u +%H)
          if [ "$$CURRENT_HOUR" = "02" ] && [ "$$CURRENT_DAY" != "$$LAST_RUN_DAY" ]; then
            echo "[backup] Starting daily backup at $$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            if node scripts/backup-verify.mjs; then
              LAST_RUN_DAY="$$CURRENT_DAY"
              sh /opt/monitoring/backup-metrics.sh || echo "[backup] textfile write failed"
              echo "[backup] Daily backup SUCCESS"
            else
              echo "[backup] Backup FAILED — will retry next hour"
            fi
          fi
          sleep 60
        done
    environment:
      NODE_ENV:               production
      BACKUP_STORAGE_PATH:    /backups
      BACKUP_RETENTION_DAYS:  "30"
      BACKUP_GPG_RECIPIENT:   ${BACKUP_GPG_RECIPIENT:?BACKUP_GPG_RECIPIENT required (GPG key id/email)}
      BACKUP_RSYNC_TARGET:    ${BACKUP_RSYNC_TARGET:?BACKUP_RSYNC_TARGET required (user@host:/path/)}
      METRICS_TEXTFILE_DIR:   /metrics
    secrets:
      - postgres_password
      - backup_ssh_key
    volumes:
      - backup_data:/backups
      - backup_metrics:/metrics
      - ./monitoring/backup-metrics.sh:/opt/monitoring/backup-metrics.sh:ro
      # GPG keyring is read-only — the backup container only needs the recipient
      # PUBLIC key to encrypt. The private key lives on the restore host only
      # (see docs/BACKUP_KEY_MANAGEMENT.md). For dev or single-host setups where
      # the private key is co-located, mount accordingly.
      - ${GNUPG_HOME:-/root/.gnupg}:/root/.gnupg:ro
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 1g
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend

# ── Networks ──────────────────────────────────────────────────────────────────
# Two-tier network: backend (postgres+redis+api+migrate) is invisible to caddy.
# frontend (caddy+clinic+api) is the only path inbound traffic can take.
networks:
  backend:
    driver: bridge
    internal: false   # api needs egress for Resend/HIBP/etc.; flip true for stricter isolation
  frontend:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  caddy_data:       # ACME account + issued certs (PRESERVE THIS)
  caddy_config:
  prometheus_data:    # 30d TSDB retention, capped at 5 GB
  alertmanager_data:  # silences + notification log
  grafana_data:       # admin sessions, starred dashboards
  backup_data:        # Local backup files. Mount a host path or NFS in prod
                      # for durability beyond container lifetime.
  backup_metrics:     # Shared volume between backup container and node_exporter
                      # textfile collector. backup-metrics.sh writes backup.prom here;
                      # node_exporter reads it for BackupStale + BackupMissingTextfile alerts.

# ── Secrets ───────────────────────────────────────────────────────────────────
# All files: mode 0600 owned by the deploy user. Never check into git.
# Generators (run once per secret, then escrow safely):
#   openssl rand -base64 48 > ./secrets/postgres_password
#   openssl rand -base64 48 > ./secrets/redis_password
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" > ./secrets/session_secret
#   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))" > ./secrets/field_encryption_key
#   openssl rand -hex 32 > ./secrets/metrics_token
#   # JWT key pair — generate both atomically:
#   node -e "const c=require('crypto');const kp=c.generateKeyPairSync('ed25519',{privateKeyEncoding:{type:'pkcs8',format:'pem'},publicKeyEncoding:{type:'spki',format:'pem'}});require('fs').writeFileSync('./secrets/jwt_private_key',kp.privateKey);require('fs').writeFileSync('./secrets/jwt_public_key',kp.publicKey)"
# Then: chmod 600 ./secrets/*
# Rotation: see SECURITY.md §"JWT key rotation" and §"Secret rotation".
secrets:
  postgres_password:
    file: ./secrets/postgres_password
  # Runtime app role password. api + worker connect as medicore_app using this
  # secret (F-01 fix). Generate: openssl rand -base64 48 | tr -d '\n' > ./secrets/app_db_password
  # The migrate container sets this password on the medicore_app role after migrations run.
  app_db_password:
    file: ./secrets/app_db_password
  redis_password:
    file: ./secrets/redis_password
  session_secret:
    file: ./secrets/session_secret
  field_encryption_key:
    file: ./secrets/field_encryption_key
  metrics_token:
    file: ./secrets/metrics_token
  jwt_private_key:
    file: ./secrets/jwt_private_key
  jwt_public_key:
    file: ./secrets/jwt_public_key
  grafana_password:
    # Grafana admin password (plain text, mode 0600).
    # Generate: openssl rand -base64 32 > ./secrets/grafana_password
    file: ./secrets/grafana_password
  smtp_auth_password:
    # SMTP password / app-token for Alertmanager email delivery (F-P6-5, mode 0600).
    # Alertmanager reads it via smtp_auth_password_file in alertmanager.yml.
    # Use an app-specific token, never a reusable password.
    # Write: printf '%s' '<smtp-app-token>' > ./secrets/smtp_auth_password
    file: ./secrets/smtp_auth_password
  backup_ssh_key:
    # Private SSH key for rsync-over-SSH offsite uploads. Mode 0600.
    # Generate: ssh-keygen -t ed25519 -N "" -f ./secrets/backup_ssh_key
    # Then add ./secrets/backup_ssh_key.pub to ~/.ssh/authorized_keys on the
    # offsite server. First connection: docker compose exec backup ssh \
    #   -i /run/secrets/backup_ssh_key user@offsite true  (accepts host key).
    file: ./secrets/backup_ssh_key
