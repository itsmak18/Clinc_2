server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers (mirror the Express helmet config) ────────────────────
    add_header X-Frame-Options         "DENY"               always;
    add_header X-Content-Type-Options  "nosniff"            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy      "camera=(), microphone=(), geolocation=()" always;

    # ── API proxy — forward /api/* to the backend container ───────────────────
    location /api/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;

        # Required for SSE (Server-Sent Events) — disable buffering so events
        # stream to the browser immediately without waiting for the buffer to fill.
        proxy_buffering    off;
        proxy_cache        off;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Propagate the connection header for SSE keep-alive
        proxy_set_header   Connection        "";
    }

    # ── Prometheus metrics — do not expose to the outside world ───────────────
    location /metrics {
        deny all;
        return 403;
    }

    # ── Static assets — long cache for hashed filenames ───────────────────────
    location ~* \.(js|css|woff2?|ttf|otf|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback — serve index.html for all non-asset routes ──────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Disable nginx version leak
    server_tokens off;
}
