# PgBouncer configuration for MediCore production.
#
# This file is a TEMPLATE — the entrypoint in docker-compose.prod.yml generates
# a runtime copy at /tmp/pgbouncer.ini with the userlist path filled in.
# Do not mount this file directly into the container.
#
# Pool math (see RUNBOOK §PgBouncer):
#   api + worker each run DB_POOL_MAX connections → PgBouncer (cheap, no OS sock).
#   PgBouncer opens default_pool_size connections → Postgres (the scarce resource).
#   Postgres max_connections = 100.
#   Budget: default_pool_size=20 (api+worker) + migrate(2) + backup(1) = 23 ≪ 100.
#   Adding a 2nd api replica: raise default_pool_size, NOT Postgres max_connections.

[databases]
# Wildcard: any dbname requested by the client is forwarded to postgres:5432
# with the same dbname. The compose DATABASE_URL encodes the correct dbname.
* = host=postgres port=5432

[pgbouncer]
listen_port = 6432
listen_addr = *

# MD5 auth: password hash stored in /tmp/userlist.txt (generated at startup
# from ./secrets/app_db_password to keep the plaintext out of the filesystem).
auth_type = md5
auth_file = /tmp/userlist.txt

# Transaction pooling: the server connection is returned to the pool after
# each transaction completes. SET LOCAL GUCs used by runInTenantContext are
# transaction-scoped — they commit/rollback with the txn and cannot bleed
# to the next borrower. See ADR-009 and RUNBOOK §PgBouncer.
pool_mode = transaction

# Connections from PgBouncer → Postgres (the actual scarce resource).
# Raise this (and verify Postgres max_connections headroom) when adding replicas.
default_pool_size = 20
# Reserved slots for admin queries when the pool is saturated.
reserve_pool_size = 5
reserve_pool_timeout = 3

# Connections from app (api+worker) → PgBouncer (cheap — no full OS socket).
max_client_conn = 200

# DISCARD ALL between transactions resets session state (temp tables, advisory
# locks, etc.) so a borrower never sees another tenant's session artifacts.
# SET LOCAL GUCs are already reverted at COMMIT/ROLLBACK before DISCARD runs.
server_reset_query = DISCARD ALL

# Suppress startup-parameter warnings for parameters set by node-pg or psql
# that PgBouncer does not forward.
ignore_startup_parameters = extra_float_digits,search_path

# Connection lifecycle
server_connect_timeout = 5
server_idle_timeout = 600
client_idle_timeout = 0
tcp_keepalive = 1

# Logging — keep minimal in production to avoid log noise
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1

# Stats period for the internal pgbouncer stats (SHOW STATS)
stats_period = 60
