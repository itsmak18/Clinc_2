groups:
  - name: medicore-api-alerts
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate (> 1%)"
          description: "The API is returning 5xx errors for more than 1% of requests over the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 API Latency (> 500ms)"
          description: "The P95 latency across all routes is exceeding 500ms over the last 5 minutes."

      - alert: DBPoolExhaustion
        expr: db_pool_waiting_clients > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database Connection Pool Exhaustion"
          description: "Clients are queuing for database connections for over 2 minutes."

      - alert: DBPoolHighUtilization
        expr: (db_pool_total_connections - db_pool_idle_connections) / db_pool_total_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database Pool > 80% Utilized"
          description: "The DB connection pool has been >80% utilized for 5 minutes. Consider scaling DB_POOL_MAX."
