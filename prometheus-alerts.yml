groups:
  # ── Application-level alerts ─────────────────────────────────────────────────
  # All metrics in this group are emitted by the MediCore API process itself.
  # No additional exporters required.
  - name: medicore-api-alerts
    rules:
      # Liveness: `up` is the synthetic per-target sample Prometheus writes on
      # every scrape (1 = scrape succeeded, 0 = target unreachable). It needs no
      # exporter. This is the PRIMARY availability alert: a crashed/OOM-killed
      # api or worker process produces ZERO http_requests_total, so HighErrorRate
      # (a ratio over request rate) can never fire on a full outage — the series
      # just goes stale. Without this rule a dead process pages no one.
      # Covers both the api and the worker scrape jobs (see prometheus.yml).
      - alert: ServiceDown
        expr: up{job=~"medicore-api|medicore-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "MediCore {{ $labels.job }} is DOWN (scrape failing)"
          description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }} (up==0) for 1 minute. The process is crashed, OOM-killed, crash-looping, or unreachable. Clinic surface is degraded or offline. Check `docker compose ps` and `docker compose logs {{ $labels.job }} --tail=200`."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.01
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High API Error Rate (> 1%)"
          description: "The API is returning 5xx errors for more than 1% of requests over the last 5 minutes."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 API Latency (> 500ms)"
          description: "The P95 latency across all routes is exceeding 500ms over the last 5 minutes."

      - alert: DBPoolExhaustion
        expr: db_pool_waiting_clients > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Database Connection Pool Exhaustion"
          description: "Clients are queuing for database connections for over 2 minutes."

      - alert: DBPoolHighUtilization
        expr: (db_pool_total_connections - db_pool_idle_connections) / db_pool_total_connections > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Database Pool > 80% Utilized"
          description: "The DB connection pool has been >80% utilized for 5 minutes. Consider scaling DB_POOL_MAX."

      # HIPAA-critical: any permanent audit loss fires immediately (no grace period).
      # Metric emitted by the drain worker in lib/audit.ts when a row exhausts all
      # retry attempts. Even a single occurrence requires manual review and incident
      # assessment under HIPAA §164.312(b).
      - alert: AuditLogPermanentLoss
        expr: increase(audit_log_write_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Permanent audit log loss — PHI access without durable trail"
          description: "{{ $value }} audit outbox row(s) exhausted all retry attempts in the last 5 minutes. PHI was accessed without a durable audit entry. Requires immediate review and HIPAA incident assessment. Check audit_outbox_row_exhausted log entries for affected entity IDs."

      # The drain worker samples outbox depth on every 5-second tick. A sustained
      # backlog means the drain loop is stuck or Postgres is under heavy pressure.
      - alert: AuditOutboxBacklog
        expr: audit_outbox_depth > 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit outbox backlog > 100 rows for 10 min"
          description: "{{ $value }} audit events are pending drain. The outbox drain worker may be stuck or Postgres is under sustained write pressure. Events are delayed, not lost, as long as the outbox table is healthy."

      # HIPAA-critical: a mismatch means audit_log rows were modified or deleted
      # after the daily hash was recorded. Even a single occurrence requires immediate
      # investigation and a HIPAA breach assessment under §164.312(b).
      - alert: AuditIntegrityMismatch
        expr: increase(audit_integrity_check_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Audit log hash-chain mismatch — possible tampering"
          description: "{{ $value }} daily audit integrity check(s) detected a SHA-256 hash mismatch in the last hour. Audit log rows may have been modified or deleted after the hash was recorded. Requires immediate investigation and HIPAA incident assessment under §164.312(b). Query audit_integrity_checks WHERE status = 'mismatch' to identify affected dates."

      # RSS above 768 MB on a 1 GB container limit leaves < 25% headroom.
      # prom-client collectDefaultMetrics() provides this gauge.
      - alert: HighNodeMemory
        expr: process_resident_memory_bytes > 805306368
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node.js API process RSS > 768 MB"
          description: "Node.js API resident memory is {{ $value | humanize1024 }}B — has exceeded 768 MB for 5 minutes. Possible memory leak or insufficient container memory limit (currently 1 GB in compose). Investigate heap snapshots."

      # prom-client 15.x exposes nodejs_eventloop_lag_p99_seconds from
      # collectDefaultMetrics(). > 500ms indicates CPU starvation or blocking sync I/O.
      - alert: HighEventLoopLag
        expr: nodejs_eventloop_lag_p99_seconds > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Node.js event loop P99 lag > 500ms"
          description: "Event loop P99 lag is {{ $value }}s — sustained above 500ms for 2 minutes. Look for blocking synchronous operations (bcrypt, crypto, JSON.parse on large payloads) or CPU starvation under load."

      # Partition headroom: the monthly data-retention cron (1st of month 03:00 UTC)
      # emits the number of future audit_logs monthly partitions that exist.
      # Below 24 months means < 2 years of headroom remain before rows overflow
      # into the DEFAULT catch-all partition (where they can't be pruned by month).
      # Resolution: land a follow-up migration to extend the partition horizon.
      - alert: AuditPartitionLow
        expr: audit_partition_months_remaining < 24
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "audit_logs partition horizon < 24 months"
          description: "Only {{ $value }} future monthly audit_logs partitions remain. Rows will overflow into the DEFAULT partition when the horizon is exhausted, preventing month-granularity pruning and HIPAA partition-drop retention. Land a follow-up migration (see docs/adr/ADR-009-audit-partitioning.md) to pre-create additional monthly partitions."

      # SSE connection capacity: active client connections approaching the limit.
      # Capped at 500 per process (SSE_MAX_CONNECTIONS). Above 400 (80%) starts to
      # squeeze headroom, potentially causing new client connection attempts to fail or evict.
      - alert: SSEConnectionsHigh
        expr: sse_active_connections > 400
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High SSE Connections (> 80% capacity)"
          description: "Active Server-Sent Events connections are {{ $value }}, which is exceeding 80% of the 500-connection limit per process."

      # Break-glass audit durability (2026-06-27). Three tiers:
      # 1. Fallback used — primary audit_logs insert failed, event diverted to local sink.
      # 2. Loss — both primary AND fallback failed — HIPAA compliance incident.
      # 3. Backlog — fallback sink not draining (reconcile stuck or DB sustained outage).

      - alert: BreakGlassAuditFallback
        expr: increase(break_glass_audit_fallback_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Break-glass audit primary failed — events in local fallback sink"
          description: "{{ $value }} break-glass audit event(s) could not be written directly to audit_logs in the last 5 minutes and were diverted to the local JSONL fallback sink. This indicates the audit DB is degraded. Events are NOT lost — they will reconcile when the DB recovers. Check audit_logs Postgres health and disk space."

      - alert: BreakGlassAuditLoss
        expr: increase(break_glass_audit_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Break-glass audit loss — PHI accessed without durable audit record"
          description: "{{ $value }} break-glass audit event(s) could not be written to EITHER audit_logs OR the local fallback sink in the last 5 minutes. Emergency PHI was accessed without a durable audit trail. This is a HIPAA §164.312(a)(2)(ii) compliance incident requiring immediate investigation. Check break_glass_audit_fallback_failed_event_unrecorded log entries."

      - alert: BreakGlassAuditFallbackBacklog
        expr: break_glass_audit_fallback_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Break-glass audit fallback sink has unreconciled events (> 10 min)"
          description: "{{ $value }} break-glass audit event(s) have been sitting in the local JSONL fallback sink for more than 10 minutes without reconciling into audit_logs. The 60-second reconcile loop may be stuck or Postgres sustained write pressure. Check audit_logs insert health and worker process status."

      # General audit-outbox write durability (AUD-SEAM-01, 2026-07-02). Same three
      # tiers as the break-glass block above, but for logAudit()'s normal hot path —
      # this is what every ordinary PHI READ/CREATE/UPDATE/DELETE audit event goes
      # through, not just break-glass sessions. The metrics existed without alerts
      # until the 2026-07-02 architecture audit (finding F5): a PHI read still
      # returns 200 even when both the outbox INSERT and its fallback sink fail —
      # deliberate (reads must not block on audit-DB health), but that means this
      # alert is the ONLY signal an operator gets that it happened.
      # 1. Fallback used — audit_outbox insert failed, event diverted to local sink.
      # 2. Loss — both audit_outbox insert AND fallback failed — HIPAA compliance incident.
      # 3. Backlog — fallback sink not draining (reconcile stuck or DB sustained outage).

      - alert: AuditOutboxFallbackUsed
        expr: increase(audit_outbox_fallback_total[5m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Audit outbox insert failed — events in local fallback sink"
          description: "{{ $value }} audit event(s) could not be written directly to audit_outbox in the last 5 minutes and were diverted to the local JSONL fallback sink. This indicates the audit DB is degraded. Events are NOT lost — they will reconcile into audit_outbox on the 60s reconcile loop. Check Postgres health and disk space."

      - alert: AuditOutboxFallbackLoss
        expr: increase(audit_outbox_fallback_write_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "Audit event loss — PHI accessed/modified without durable audit record"
          description: "{{ $value }} audit event(s) could not be written to EITHER audit_outbox OR the local fallback sink in the last 5 minutes. PHI was accessed or modified without a durable audit trail. This is a HIPAA §164.312(b) compliance incident requiring immediate investigation. Check audit_outbox_fallback_write_failed_event_unrecorded log entries."

      - alert: AuditOutboxFallbackBacklog
        expr: audit_outbox_fallback_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit outbox fallback sink has unreconciled events (> 10 min)"
          description: "{{ $value }} audit event(s) have been sitting in the local JSONL fallback sink for more than 10 minutes without reconciling into audit_outbox. The 60-second reconcile loop may be stuck or Postgres sustained write pressure. Check audit_outbox insert health and worker process status."

  # ── Infrastructure-level alerts ───────────────────────────────────────────────
  # The exporters these rules depend on ARE deployed in docker-compose.prod.yml as
  # of 2026-06-03: redis_exporter (job "redis"), node_exporter (job "node"), and
  # blackbox_exporter (job "blackbox-tls"). See monitoring/prometheus/prometheus.yml.
  # NOTE: the blackbox-tls job target uses ${BLACKBOX_TARGET}, which Prometheus does
  # NOT env-expand in its config file — until that is resolved (see F-P6-7) the SSL
  # and EdgeProbeDown series below have no real target and will not fire.
  - name: medicore-infrastructure-alerts
    rules:
      # External availability: probe_success is 0 when blackbox_exporter cannot
      # complete the HTTP probe against the public/edge endpoint (Caddy down, DNS
      # failure, TLS handshake failure). This is what makes RUNBOOK §7's "stop
      # Caddy → alerting fires within 5 minutes" chaos-drill criterion achievable.
      # Depends on the blackbox-tls job having a real target (see F-P6-7).
      - alert: EdgeProbeDown
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "External probe failing for {{ $labels.instance }}"
          description: "blackbox_exporter HTTP probe against {{ $labels.instance }} has failed for 2 minutes (probe_success==0). The edge (Caddy/TLS/DNS) is unreachable from the probe's vantage point even though internal services may be up. Verify Caddy is running and the domain resolves."

      # Requires: redis_exporter (https://github.com/oliver006/redis_exporter)
      # Add to docker-compose: image: oliver006/redis_exporter, target: redis:6379
      # Redis is configured with --maxmemory 512mb --maxmemory-policy allkeys-lru.
      # Above 85% eviction of clinical session data begins, degrading availability.
      - alert: RedisHighMemory
        expr: redis_memory_used_bytes / (redis_maxmemory_bytes > 0) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Redis memory > 85% of maxmemory"
          description: "Redis is using {{ $value | humanizePercentage }} of its configured maxmemory limit. Key eviction is imminent — rate-limit state and session data may be discarded. Consider increasing maxmemory or flushing unused keys."

      # Requires: node_exporter (https://github.com/prometheus/node_exporter)
      # Add to docker-compose: image: prom/node-exporter, host PID/network namespace.
      # Below 10% free disk, Postgres WAL writes and audit log drain will start
      # failing, which is both a reliability and HIPAA audit-trail risk.
      - alert: DiskSpaceCritical
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          < 0.10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Disk space below 10% on {{ $labels.mountpoint }}"
          description: "Only {{ $value | humanizePercentage }} free disk on {{ $labels.instance }}:{{ $labels.mountpoint }}. Postgres WAL and audit outbox drain will begin failing. Immediate action required: clear old WAL archives or expand volume."

      # Requires: blackbox_exporter (https://github.com/prometheus/blackbox_exporter)
      # Configure a probe module `https_2xx` targeting the public API domain.
      # A 14-day window gives enough runway for certificate renewal without an
      # emergency. Caddy auto-renews from Let's Encrypt — this alert catches failures
      # in the renewal flow (DNS issues, rate limits, ACME challenges blocked).
      - alert: SSLCertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 14
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "TLS certificate expires in < 14 days for {{ $labels.instance }}"
          description: "Certificate on {{ $labels.instance }} expires in {{ $value | humanizeDuration }}. Check Caddy auto-renewal logs. If renewal is blocked, re-issue manually to prevent clinic disruption."

  # ── Backup freshness ────────────────────────────────────────────────────────
  # Requires: node_exporter with --collector.textfile.directory=/metrics.
  # The backup container writes backup.prom (see monitoring/backup-metrics.sh)
  # after every successful run. If no successful backup has landed in 26 hours
  # (daily schedule + 2 h grace) the alert fires — daily 02:00 UTC schedule
  # gives a 24 h cadence; 26 h covers one missed run only.
  - name: medicore-backup-alerts
    rules:
      - alert: BackupStale
        expr: (time() - backup_last_success_timestamp_seconds) > 93600
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful backup in the last 26 hours"
          description: "Last successful backup was {{ $value | humanizeDuration }} ago. Check the backup container logs (docker compose logs backup) and verify GPG keyring + offsite SSH target."

      - alert: BackupMissingTextfile
        expr: absent(backup_last_success_timestamp_seconds)
        for: 6h
        labels:
          severity: warning
        annotations:
          summary: "backup_last_success_timestamp_seconds series missing"
          description: "node_exporter has not exposed a backup textfile metric for 6 hours. Either backup-metrics.sh is not running on success or the /metrics volume mount is broken."

  - name: medicore-security-alerts
    rules:
      # Break-glass velocity: a user activating more than 3 sessions per hour
      # is statistically anomalous and may indicate insider PHI-browsing abuse.
      # Real emergencies rarely require > 3 break-glass activations in an hour.
      # The app also emits a real-time SSE velocity alert to compliance officers
      # at the same threshold.
      - alert: BreakGlassVelocity
        expr: increase(break_glass_activations_total[1h]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "High break-glass activation rate for user {{ $labels.user_id }}"
          description: "User {{ $labels.user_id }} in clinic {{ $labels.clinic_id }} has activated break-glass {{ $value }} times in the last hour (threshold: 3). Review audit logs for possible insider abuse."
