          description: paidInvoices / (paidInvoices + pendingInvoices).
        averageInvoiceValue:
          type: number
        byDay:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              revenue:
                type: number
              invoices:
                type: integer
            required: [date, revenue, invoices]
        topServices:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              revenue:
                type: number
              count:
                type: integer
            required: [name, revenue, count]
        previous:
          type: object
          description: Same metrics for the immediately-preceding window of equal length (period-over-period).
          properties:
            totalRevenue:
              type: number
            paidInvoices:
              type: integer
            collectionRate:
              type: number
          required: [totalRevenue, paidInvoices, collectionRate]
      required: [totalRevenue, totalInvoices, paidInvoices, pendingInvoices, cancelledInvoices, pendingAmount, collectionRate, averageInvoiceValue, byDay, topServices, previous]

