      responses:
        "200":
          description: List of doctors with schedules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DoctorScheduleSummary"

  /schedule/doctor/{doctorId}:
    get:
      operationId: getDoctorSchedule
      tags: [schedule]
      summary: Get a doctor's full schedule (template + overrides)
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Doctor schedule detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorScheduleDetail"

  /schedule/doctor/{doctorId}/weekly:
    post:
      operationId: upsertWeeklyBlock
      tags: [schedule]
      summary: Create or update a weekly schedule block for a doctor
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertWeeklyBlockBody"
      responses:
        "201":
          description: Weekly block created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorScheduleDay"

  /schedule/doctor/{doctorId}/weekly/{day}/status:
    patch:
      operationId: updateWeeklyBlockStatus
      tags: [schedule]
      summary: Toggle a weekly block active or inactive
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
        - name: day
          in: path
          required: true
          schema:
            type: string
            enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, inactive]
              required: [status]
      responses:
        "200":
          description: Updated block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DoctorScheduleDay"

  /schedule/doctor/{doctorId}/weekly/{day}:
    delete:
      operationId: deleteWeeklyBlock
      tags: [schedule]
      summary: Remove a day from a doctor's weekly template
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
        - name: day
          in: path
          required: true
          schema:
            type: string
            enum: [sunday, monday, tuesday, wednesday, thursday, friday, saturday]
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /schedule/doctor/{doctorId}/override:
    post:
      operationId: upsertScheduleOverride
      tags: [schedule]
      summary: Add or update a date-specific schedule override
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertOverrideBody"
      responses:
        "201":
          description: Override created or updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleOverride"

  /schedule/doctor/{doctorId}/override/{date}:
    delete:
      operationId: deleteScheduleOverride
      tags: [schedule]
      summary: Remove a date-specific override
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /schedule/availability/{doctorId}:
    get:
      operationId: getDoctorAvailability
