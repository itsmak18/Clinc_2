            type: string
            format: date
      responses:
        "200":
          description: Week schedule summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        fullNameAr:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, doctor, nurse, front_desk, xray_staff, lab_staff]
        isActive:
          type: boolean
        isOnShift:
          type: boolean
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, username, fullName, role, isActive, isOnShift, createdAt]

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        fullName:
          type: string
        fullNameAr:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, doctor, nurse, front_desk, xray_staff, lab_staff]
        phone:
          type: string
      required: [username, password, fullName, role]

    UpdateUserBody:
      type: object
      properties:
        fullName:
          type: string
        fullNameAr:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, doctor, nurse, front_desk, xray_staff, lab_staff]
        isActive:
          type: boolean
        phone:
          type: string

    ResetPasswordBody:
      type: object
      properties:
        newPassword:
          type: string
      required: [newPassword]

    Patient:
      type: object
      properties:
        id:
          type: integer
        mrn:
          type: string
        fullName:
          type: string
        fullNameAr:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        phone:
          type: string
        address:
          type: string
          nullable: true
        bloodType:
          type: string
          nullable: true
        allergies:
          type: string
          nullable: true
        emergencyContact:
          type: string
          nullable: true
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required: [id, mrn, fullName, dateOfBirth, gender, phone, isActive, createdAt]

    PaginatedPatients:
      type: object
      properties:
        patients:
          type: array
          items:
            $ref: "#/components/schemas/Patient"
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
      required: [patients, total, limit, offset]

    CreatePatientBody:
      type: object
      properties:
        fullName:
          type: string
        fullNameAr:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        phone:
          type: string
        address:
          type: string
        bloodType:
          type: string
        allergies:
          type: string
        emergencyContact:
          type: string
      required: [fullName, dateOfBirth, gender, phone]

    UpdatePatientBody:
      type: object
      properties:
        fullName:
          type: string
        fullNameAr:
          type: string
        dateOfBirth:
          type: string
          format: date
        gender:
          type: string
          enum: [male, female]
        phone:
          type: string
        address:
          type: string
        bloodType:
          type: string
        allergies:
          type: string
        emergencyContact:
          type: string

    PatientSummary:
      type: object
      properties:
        patient:
          $ref: "#/components/schemas/Patient"
        recentAppointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        recentRecords:
          type: array
          items:
            $ref: "#/components/schemas/MedicalRecord"
        recentXrays:
          type: array
          items:
            $ref: "#/components/schemas/XrayRecord"
        recentLabTests:
          type: array
          items:
            $ref: "#/components/schemas/LabTest"
        outstandingBalance:
          type: number
      required: [patient, recentAppointments, recentRecords, recentXrays, recentLabTests, outstandingBalance]

    Appointment:
      type: object
      properties:
        id:
          type: integer
        patientId:
          type: integer
        doctorId:
          type: integer
        patient:
          $ref: "#/components/schemas/Patient"
        doctor:
          $ref: "#/components/schemas/User"
        scheduledAt:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [scheduled, checked_in, in_triage, ready_for_doctor, in_consultation, awaiting_diagnostics, pending_payment, completed, cancelled, no_show, in_progress]
        bookingSource:
          type: string
          enum: [online, phone, walk_in]
          nullable: true
        triagePriority:
          type: string
          enum: [normal, urgent, critical]
          nullable: true
        cancellationReason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        checkedInAt:
          type: string
          format: date-time
          nullable: true
        triageStartedAt:
          type: string
          format: date-time
          nullable: true
        consultationStartedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, patientId, doctorId, scheduledAt, reason, status, createdAt]

    CreateAppointmentBody:
      type: object
      properties:
        patientId:
          type: integer
        doctorId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        reason:
          type: string
        notes:
          type: string
        bookingSource:
          type: string
          enum: [online, phone, walk_in]
      required: [patientId, doctorId, scheduledAt, reason]

    UpdateAppointmentBody:
      type: object
      properties:
        doctorId:
          type: integer
        scheduledAt:
          type: string
          format: date-time
        reason:
          type: string
        status:
          type: string
          enum: [scheduled, checked_in, in_triage, ready_for_doctor, in_consultation, awaiting_diagnostics, pending_payment, completed, cancelled, no_show, in_progress]
        cancellationReason:
          type: string
        notes:
          type: string
        triagePriority:
          type: string
          enum: [normal, urgent, critical]
        bookingSource:
          type: string
          enum: [online, phone, walk_in]

    TodayAppointments:
      type: object
      properties:
        appointments:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        total:
          type: integer
        scheduled:
          type: integer
        checkedIn:
          type: integer
        completed:
          type: integer
        cancelled:
          type: integer
      required: [appointments, total, scheduled, checkedIn, completed, cancelled]

    DischargeSheet:
      type: object
      properties:
        appointment:
          $ref: "#/components/schemas/Appointment"
        patient:
          $ref: "#/components/schemas/Patient"
        medicalRecord:
          $ref: "#/components/schemas/MedicalRecord"
          nullable: true
        prescriptions:
          type: array
          items:
            $ref: "#/components/schemas/Prescription"
        labTests:
          type: array
          items:
            $ref: "#/components/schemas/LabTest"
        xrays:
          type: array
          items:
            $ref: "#/components/schemas/XrayRecord"
        invoice:
          $ref: "#/components/schemas/Invoice"
          nullable: true
      required: [appointment, patient, prescriptions, labTests, xrays]

    PatientFlow:
      type: object
      properties:
        stageCounts:
          type: object
          properties:
            scheduled: { type: integer }
            checked_in: { type: integer }
            in_triage: { type: integer }
            ready_for_doctor: { type: integer }
            in_consultation: { type: integer }
            awaiting_diagnostics: { type: integer }
            pending_payment: { type: integer }
