    # Financial clearance of a clinical order (lab/x-ray/ultrasound) — orthogonal
    # to the order's workflow status (ADR-011). pending = awaiting payment,
    # workflow blocked; cleared = basket paid; overridden = emergency clearance
    # (invoice stays pending); expired = never paid within TTL / basket cancelled.
    ClearanceStatus:
      type: string
      enum: [pending, cleared, overridden, expired]

    OrderCharge:
      type: object
      description: >-
        The order's own charge line (quantity × unit price), in integer cents.
        Deliberately the ONLY billing fact exposed on department order rows —
        never invoice totals, basket balance, or payment history
        (clearance-visibility plan D1). Null on pre-gate rows.
      properties:
        amountCents:
          type: integer
      required: [amountCents]

