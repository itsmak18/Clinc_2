        id:
          type: integer
        username:
          type: string
        fullName:
          type: string
        fullNameAr:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, doctor, nurse, front_desk, xray_staff, lab_staff]
        isActive:
          type: boolean
        isOnShift:
          type: boolean
        phone:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required: [id, username, fullName, role, isActive, isOnShift, createdAt]

    CreateUserBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
        fullName:
          type: string
        fullNameAr:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [super_admin, admin, doctor, nurse, front_desk, xray_staff, lab_staff]
        phone:
          type: string
      required: [username, password, fullName, role]

    UpdateUserBody:
