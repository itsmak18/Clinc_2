          maxLength: 200
        content:
          type: string
          minLength: 10
        reason:
          type: string
          minLength: 20
      required: [title, content, reason]

    DoctorKPIs:
      type: object
      properties:
        totalAppointments:
          type: integer
        completedAppointments:
          type: integer
        noShowCount:
          type: integer
        noShowRate:
          type: number
        cancelledCount:
          type: integer
        cancellationRate:
          type: number
        avgConsultMinutes:
          type: number
        avgWaitMinutes:
          type: number
        revenueGenerated:
          type: number
        labOrders:
          type: integer
        xrayOrders:
          type: integer
        orderRate:
          type: number
      required:
        - totalAppointments
        - completedAppointments
        - noShowCount
        - noShowRate
        - cancelledCount
        - cancellationRate
        - avgConsultMinutes
        - avgWaitMinutes
        - revenueGenerated
        - labOrders
        - xrayOrders
        - orderRate

    DoctorAnalyticsRow:
      type: object
      properties:
        doctorId:
          type: integer
        doctorName:
          type: string
        kpis:
          $ref: "#/components/schemas/DoctorKPIs"
      required: [doctorId, doctorName, kpis]

    DoctorTrendPoint:
      type: object
      properties:
        month:
          type: string
          description: ISO month string e.g. "2026-04"
        totalAppointments:
          type: integer
        completedAppointments:
          type: integer
        noShowCount:
          type: integer
        revenueGenerated:
