            type: integer
      responses:
        "200":
          description: Consent revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Consent"

  # BREAK-GLASS
  /break-glass/patients/{patientId}/activate:
    post:
      operationId: activateBreakGlass
      tags: [break-glass]
      summary: Activate emergency break-glass access for a patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ActivateBreakGlassBody"
      responses:
        "201":
          description: Break-glass session activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSession"

  /break-glass/sessions:
    get:
      operationId: listBreakGlassSessions
      tags: [break-glass]
      summary: List break-glass sessions
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: active
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          description: Opaque cursor (last id from previous page). Omit on the first request.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        "200":
          description: List of break-glass sessions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedBreakGlassSessions"

  /break-glass/sessions/{sessionId}/approve:
    post:
      operationId: approveBreakGlass
      tags: [break-glass]
      summary: Approve a break-glass session (extend to full TTL)
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSession"

  /break-glass/sessions/{sessionId}/revoke:
    post:
      operationId: revokeBreakGlass
      tags: [break-glass]
      summary: Revoke a break-glass session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Session revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BreakGlassSession"

  # ERASURE
  /erasure-requests:
    get:
      operationId: listErasureRequests
      tags: [erasure]
      summary: List right-to-erasure requests
      parameters:
        - name: cursor
          in: query
          description: Opaque cursor (last id from previous page). Omit on the first request.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            maximum: 100
      responses:
        "200":
          description: List of erasure requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedErasureRequests"
    post:
      operationId: createErasureRequest
      tags: [erasure]
      summary: Create a right-to-erasure request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateErasureBody"
      responses:
        "201":
          description: Erasure request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErasureRequest"

  /erasure-requests/{id}/review:
    post:
      operationId: reviewErasureRequest
