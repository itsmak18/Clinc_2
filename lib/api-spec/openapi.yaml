openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Clinic Management System API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: users
    description: User management
  - name: patients
    description: Patient management
  - name: appointments
    description: Appointment management
  - name: medical-records
    description: Medical records
  - name: prescriptions
    description: Prescriptions
  - name: xray
    description: X-ray imaging
  - name: ultrasound
    description: Ultrasound imaging
  - name: lab
    description: Laboratory tests
  - name: billing
    description: Billing and payments
  - name: operations
    description: Operation room management
  - name: inventory
    description: Inventory management
  - name: reports
    description: Reports and analytics
  - name: notifications
    description: System notifications
  - name: audit
    description: Audit logs
  - name: dashboard
    description: Dashboard summaries
  - name: schedule
    description: Doctor schedule management
  - name: security
    description: CSP violation reporting
  - name: clinic-notices
    description: Clinic-wide advisory notices
  - name: consent
    description: Patient consent management
  - name: break-glass
    description: Emergency break-glass PHI access
  - name: erasure
    description: Right-to-erasure (GDPR) requests
  - name: analytics
    description: Doctor performance KPIs and benchmarking

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # AUTH
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginBody"
      responses:
        "200":
          description: Login successful; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "202":
          description: New device detected — email verification required (Phase 2). No session issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PendingVerificationResponse"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current logged in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # USERS
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all staff users
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [super_admin, admin, doctor, nurse, front_desk, xray_staff, lab_staff]
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    put:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Soft delete user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User deleted

  /users/{userId}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset user password
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPasswordResetBody"
      responses:
        "200":
          description: Password reset

  /users/on-shift:
    get:
      operationId: getOnShiftUsers
      tags: [users]
      summary: Get all users currently on shift
      responses:
        "200":
          description: On-shift users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{userId}/toggle-shift:
    post:
      operationId: toggleUserShift
      tags: [users]
      summary: Toggle on-shift status for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Shift toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  # PATIENTS
  /patients:
    get:
      operationId: listPatients
      tags: [patients]
      summary: List patients
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor (last id from previous page). Omit on the first request.
          schema:
            type: string
      responses:
        "200":
          description: List of patients
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedPatients"
    post:
      operationId: createPatient
      tags: [patients]
      summary: Register a new patient and assign MRN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientBody"
      responses:
        "201":
          description: Patient created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"

  /patients/{patientId}:
    get:
      operationId: getPatient
      tags: [patients]
      summary: Get patient by ID
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    put:
      operationId: updatePatient
      tags: [patients]
      summary: Update patient info
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePatientBody"
      responses:
        "200":
          description: Updated patient
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Patient"
    delete:
      operationId: deletePatient
      tags: [patients]
      summary: Soft delete patient
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient archived

  /patients/{patientId}/summary:
    get:
      operationId: getPatientSummary
      tags: [patients]
      summary: Get full patient summary (records, appointments, billing)
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientSummary"

  # APPOINTMENTS
  /appointments:
    get:
      operationId: listAppointments
      tags: [appointments]
      summary: List appointments
      parameters:
        - name: date
          in: query
          schema:
            type: string
            format: date
        - name: doctorId
          in: query
          schema:
            type: integer
        - name: patientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, checked_in, in_triage, ready_for_doctor, in_consultation, awaiting_diagnostics, pending_payment, completed, cancelled, no_show, in_progress]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: cursor
          in: query
          description: Opaque cursor (last id from previous page). Omit on the first request.
          schema:
            type: string
      responses:
        "200":
          description: List of appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedAppointments"
    post:
      operationId: createAppointment
      tags: [appointments]
      summary: Create appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppointmentBody"
      responses:
        "201":
          description: Appointment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}:
    get:
      operationId: getAppointment
      tags: [appointments]
      summary: Get appointment by ID
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    put:
      operationId: updateAppointment
      tags: [appointments]
      summary: Update appointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAppointmentBody"
      responses:
        "200":
          description: Updated appointment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
    delete:
      operationId: cancelAppointment
      tags: [appointments]
      summary: Cancel appointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment cancelled

  /appointments/{appointmentId}/checkin:
    post:
      operationId: checkInPatient
      tags: [appointments]
      summary: Check in patient for appointment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient checked in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}/discharge:
    get:
      operationId: getAppointmentDischarge
      tags: [appointments]
      summary: Get full discharge summary for a specific appointment visit
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Discharge summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DischargeSheet"

  /appointments/flow:
    get:
      operationId: getPatientFlow
      tags: [appointments]
      summary: Get real-time patient flow metrics by stage
      responses:
        "200":
          description: Patient flow metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientFlow"

  /appointments/today:
    get:
      operationId: getTodayAppointments
      tags: [appointments]
      summary: Get today's appointments with status summary
      responses:
        "200":
          description: Today's appointments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayAppointments"

  /appointments/{appointmentId}/triage:
    post:
      operationId: startTriage
      tags: [appointments]
      summary: Move appointment to in_triage
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Triage started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}/ready:
    post:
      operationId: markPatientReady
      tags: [appointments]
      summary: Mark patient as ready_for_doctor
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Patient marked ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}/consult:
    post:
      operationId: startConsultation
      tags: [appointments]
      summary: Start consultation (in_consultation)
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Consultation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}/diagnostics:
    post:
      operationId: requestDiagnostics
      tags: [appointments]
      summary: Move to awaiting_diagnostics
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Awaiting diagnostics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}/payment:
    post:
      operationId: pendingPayment
      tags: [appointments]
      summary: Move to pending_payment
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Pending payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  /appointments/{appointmentId}/complete:
    post:
      operationId: completeAppointment
      tags: [appointments]
      summary: Mark appointment as completed
      parameters:
        - name: appointmentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Appointment completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"

  # MEDICAL RECORDS
  /medical-records:
    get:
      operationId: listMedicalRecords
      tags: [medical-records]
      summary: List medical records
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: doctorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of medical records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MedicalRecord"
    post:
      operationId: createMedicalRecord
      tags: [medical-records]
      summary: Create medical record / visit note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMedicalRecordBody"
      responses:
        "201":
          description: Medical record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"

  /medical-records/{recordId}:
    get:
      operationId: getMedicalRecord
      tags: [medical-records]
      summary: Get medical record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Medical record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"
    put:
      operationId: updateMedicalRecord
      tags: [medical-records]
      summary: Update medical record
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMedicalRecordBody"
      responses:
        "200":
          description: Updated medical record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MedicalRecord"

  # CLINIC NOTICES
  /clinic-notices:
    get:
      operationId: listClinicNotices
      tags: [clinic-notices]
      summary: List clinic-wide advisory notices
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of clinic notices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedClinicNotices"
    post:
      operationId: createClinicNotice
      tags: [clinic-notices]
      summary: Create a clinic-wide advisory notice (super_admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateClinicNoticeBody"
      responses:
        "201":
          description: Clinic notice created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClinicNotice"

  /clinic-notices/{noticeId}:
    delete:
      operationId: deleteClinicNotice
      tags: [clinic-notices]
      summary: Soft-delete a clinic notice (super_admin only)
      parameters:
        - name: noticeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Notice deleted

  # PRESCRIPTIONS
  /prescriptions:
    get:
      operationId: listPrescriptions
      tags: [prescriptions]
      summary: List prescriptions
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: doctorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of prescriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prescription"
    post:
      operationId: createPrescription
      tags: [prescriptions]
      summary: Create prescription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrescriptionBody"
      responses:
        "201":
          description: Prescription created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  /prescriptions/{prescriptionId}:
    get:
      operationId: getPrescription
      tags: [prescriptions]
      summary: Get prescription
      parameters:
        - name: prescriptionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Prescription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prescription"

  # X-RAY
  /xray:
    get:
      operationId: listXrayImages
      tags: [xray]
      summary: List X-ray images
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, uploaded, reviewed]
      responses:
        "200":
          description: List of X-ray records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/XrayRecord"
    post:
      operationId: createXrayRecord
      tags: [xray]
      summary: Create X-ray record / upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateXrayBody"
      responses:
        "201":
          description: X-ray record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XrayRecord"

  /xray/{xrayId}:
    get:
      operationId: getXrayRecord
      tags: [xray]
      summary: Get X-ray record
      parameters:
        - name: xrayId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: X-ray record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XrayRecord"
    put:
      operationId: updateXrayRecord
      tags: [xray]
      summary: Update X-ray record (add report)
      parameters:
        - name: xrayId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateXrayBody"
      responses:
        "200":
          description: Updated X-ray record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/XrayRecord"

  # ULTRASOUND
  /ultrasound:
    get:
      operationId: listUltrasoundRecords
      tags: [ultrasound]
      summary: List ultrasound records
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, uploaded, reviewed]
      responses:
        "200":
          description: List of ultrasound records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UltrasoundRecord"
    post:
      operationId: createUltrasoundRecord
      tags: [ultrasound]
      summary: Create ultrasound record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUltrasoundBody"
      responses:
        "201":
          description: Ultrasound record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UltrasoundRecord"

  /ultrasound/{ultrasoundId}:
    get:
      operationId: getUltrasoundRecord
      tags: [ultrasound]
      summary: Get ultrasound record
      parameters:
        - name: ultrasoundId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ultrasound record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UltrasoundRecord"
    patch:
      operationId: updateUltrasoundRecord
      tags: [ultrasound]
      summary: Update ultrasound record (add report)
      parameters:
        - name: ultrasoundId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUltrasoundBody"
      responses:
        "200":
          description: Updated ultrasound record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UltrasoundRecord"

  # LABORATORY
  /lab/tests:
    get:
      operationId: listLabTests
      tags: [lab]
      summary: List lab tests
      parameters:
        - name: patientId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [requested, in_progress, completed, cancelled]
      responses:
        "200":
          description: List of lab tests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LabTest"
    post:
      operationId: createLabTest
      tags: [lab]
      summary: Request / create lab test
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLabTestBody"
      responses:
        "201":
          description: Lab test created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabTest"

  /lab/tests/{testId}:
    get:
      operationId: getLabTest
      tags: [lab]
      summary: Get lab test
      parameters:
        - name: testId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Lab test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LabTest"
