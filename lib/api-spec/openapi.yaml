      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
        - name: doctorId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Appointment report
          content:
            application/json:
