                $ref: "#/components/schemas/WeekResponse"

  # Phase 2 — Device trust, password reset, CSP reporting
  /auth/verify-device:
    post:
      operationId: verifyDevice
      tags: [auth]
      summary: Consume a device verification token and issue a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenBody"
      responses:
        "200":
          description: Device verified; session cookie set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyDeviceResponse"
        "400":
          description: Invalid, expired, or already-consumed token
        "503":
          description: Phase 2 not enabled

  /auth/wasnt-me:
    post:
      operationId: reportWasntMe
      tags: [auth]
      summary: Kill-switch — revoke all sessions and flag the device as rejected
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTokenBody"
      responses:
        "200":
          description: Sessions revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [revoked]
                required: [status]
        "400":
          description: Token expired or already consumed
        "503":
          description: Phase 2 not enabled

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a self-service password reset link (byte-identical response — no enumeration)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordBody"
      responses:
        "200":
          description: Generic response regardless of whether the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForgotPasswordResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Consume a reset token and set a new password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [reset_complete]
                required: [status]
        "400":
          description: Invalid or expired token, or password does not meet requirements

  /auth/admin-reset/{userId}:
    post:
      operationId: adminResetPassword
      tags: [auth]
      summary: Issue a one-time password reset token for a user (admin / compliance_officer only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Single-use reset token issued; deliver out-of-band to the user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminResetResponse"

  /account/devices:
    get:
      operationId: listDevices
      tags: [auth]
      summary: List trusted devices for the currently authenticated user
      responses:
        "200":
          description: Device list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceListResponse"

  /account/devices/{deviceId}:
    delete:
      operationId: revokeDevice
      tags: [auth]
      summary: Revoke a trusted device
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [revoked]
                required: [status]

  /analytics/doctors:
    get:
      operationId: listDoctorAnalytics
      tags: [analytics]
      summary: All-doctors performance leaderboard (admin only)
      parameters:
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Per-doctor KPI rows
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctors:
                    type: array
                    items:
                      $ref: "#/components/schemas/DoctorAnalyticsRow"
                  clinicAverage:
                    $ref: "#/components/schemas/DoctorKPIs"
                required: [doctors, clinicAverage]

  /analytics/doctors/{doctorId}:
    get:
      operationId: getDoctorAnalytics
      tags: [analytics]
      summary: KPIs for a single doctor (own only for doctor role; any for admin)
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: integer
        - name: dateFrom
          in: query
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Doctor KPIs + clinic average + 6-month trend
          content:
            application/json:
              schema:
                type: object
                properties:
                  doctor:
                    $ref: "#/components/schemas/DoctorKPIs"
                  clinicAverage:
                    $ref: "#/components/schemas/DoctorKPIs"
                  trend:
                    type: array
                    items:
                      $ref: "#/components/schemas/DoctorTrendPoint"
                required: [doctor, clinicAverage, trend]

  /csp-report:
    post:
      operationId: submitCspReport
      tags: [security]
      summary: Receive a CSP violation report from the browser
      requestBody:
        required: false
        content:
          application/csp-report:
            schema:
              type: object
          application/reports+json:
            schema:
              type: array
              items:
                type: object
          application/json:
            schema:
              type: object
      responses:
        "204":
          description: Report accepted (or feature disabled — always 204)

  # SEARCH
  /search:
    get:
      operationId: globalSearch
      tags: [search]
      summary: Global search across patients, appointments, and medical records
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSearchResults"

components:
  schemas:
    GlobalSearchResults:
      type: object
      properties:
        patients:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              fullName:
                type: string
              fullNameAr:
                type: string
                nullable: true
              mrn:
                type: string
              phone:
                type: string
                nullable: true
              dateOfBirth:
                type: string
                nullable: true
            required: [id, fullName, mrn]
        appointments:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              reason:
                type: string
              status:
                type: string
              scheduledAt:
                type: string
              patientName:
                type: string
                nullable: true
              patientMrn:
                type: string
                nullable: true
            required: [id, reason, status, scheduledAt]
        records:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              chiefComplaint:
                type: string
              createdAt:
                type: string
              patientName:
                type: string
                nullable: true
              patientId:
                type: integer
            required: [id, chiefComplaint, createdAt, patientId]
      required: [patients, appointments, records]

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    LoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        deviceUnverified:
          type: boolean
          description: "True when Phase 2 is active and the device is newly trusted but the email link has not yet been clicked (allow_unverified path for non-privileged roles)."
      required: [user]

    PendingVerificationResponse:
      type: object
      description: "Returned HTTP 202 when Phase 2 is active and a privileged-role user logs in from an unrecognised device. No session is issued. The user should check their email."
      properties:
        status:
          type: string
          enum: [pending_verification]
        message:
          type: string
      required: [status, message]

    DeviceTokenBody:
      type: object
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
      required: [token]

    VerifyDeviceResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
      required: [user]

    Device:
      type: object
      properties:
        deviceId:
          type: string
          format: uuid
        firstSeen:
          type: string
          format: date-time
        lastSeen:
          type: string
          format: date-time
        ipLast:
          type: string
          nullable: true
        countryLast:
          type: string
          nullable: true
        trusted:
          type: boolean
        trustSource:
          type: string
          nullable: true
        trustExpiresAt:
          type: string
          format: date-time
          nullable: true
      required: [deviceId, firstSeen, lastSeen, trusted]

    DeviceListResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
      required: [devices]

    ForgotPasswordBody:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
      required: [username]

    ForgotPasswordResponse:
      type: object
      description: "Always returned regardless of whether the account exists (enumeration prevention)."
      properties:
        status:
          type: string
          enum: [pending_verification]
        message:
          type: string
      required: [status, message]

    ResetPasswordBody:
      type: object
      properties:
        token:
          type: string
          minLength: 16
          maxLength: 256
        newPassword:
          type: string
          minLength: 8
          maxLength: 256
