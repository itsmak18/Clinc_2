name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  # ── 1. Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck (libs + artifacts)
        run: pnpm run typecheck

  # ── 2. Lint (routes ESLint rule) ─────────────────────────────────────────────
  # Enforces the service-layer boundary: route files must not import @workspace/db
  # or drizzle-orm directly. PR-B1 fixed the two existing violations
  # (inventory.ts and prescriptions.ts) by moving DB access into their service
  # files. The job is now blocking — any regression fails the build.
  lint:
    name: ESLint (routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint on routes
        run: pnpm --filter @workspace/api-server run lint

      # Frontend CSRF guard: every mutation in pages must go through Orval's
      # customFetch (which attaches X-CSRF-Token). Hand-written fetch("/api/...")
      # silently drops the header — the same bug as the 2026-05-13 logout
      # regression. PR-C deleted the last 3 apiFetch helpers + 1 raw fetch.
      - name: Block raw fetch("/api/...") in clinic pages
        run: |
          if grep -rnE "fetch\(\s*['\"\`]/api/|fetch\(\s*apiUrl\(" artifacts/clinic/src/pages/ ; then
            echo "::error::Raw fetch to /api/* is forbidden in pages — use the Orval-generated hook."
            exit 1
          fi
          echo "OK — no raw fetch('/api/...') in clinic pages."

      # Pagination guard: CLAUDE.md mandates cursor pagination ("Never use ?offset").
      # The Patients + Appointments endpoints migrated from offset → cursor in the
      # OpenAPI spec; a regression here puts the frontend back on a parameter the
      # backend silently ignores. Audit-logs is the one intentional offset survivor
      # and lives in pages/AuditLog.tsx, so it is excluded.
      - name: Block "offset:" param in clinic pages + components
        run: |
          if grep -rnE "\boffset:\s*[0-9]" artifacts/clinic/src/pages/ artifacts/clinic/src/components/ \
               --exclude=AuditLog.tsx ; then
            echo "::error::offset: pagination is forbidden — use cursor per CLAUDE.md. AuditLog.tsx is the only intentional exception."
            exit 1
          fi
          echo "OK — no offset:N pagination params in clinic pages/components."

      # DOM-XSS guard (audit F-01): document.write parses its argument as raw
      # HTML, so any new sink that interpolates staff-entered PHI without
      # escaping re-introduces the print/report DOM-XSS we closed on 2026-06-02.
      # The ONLY sanctioned sinks are openPrintWindow() in lib/print.ts (escapes
      # the title; builders escapeHtml() every field) and DischargeSheet.tsx
      # (sets the title via win.document.title, body is React-rendered). A new
      # document.write anywhere else must be reviewed and added to this allowlist
      # — do NOT widen it without escaping every dynamic value first.
      - name: Block new document.write sinks in clinic src
        run: |
          if grep -rnE "document\s*\.\s*write\s*\(" artifacts/clinic/src/ \
               --include=*.ts --include=*.tsx \
               --exclude=print.ts --exclude=DischargeSheet.tsx ; then
            echo "::error::document.write is forbidden outside the reviewed print sinks (lib/print.ts, components/DischargeSheet.tsx). Route printing through openPrintWindow() and escapeHtml() every dynamic field — see audit F-01."
            exit 1
          fi
          echo "OK — no unsanctioned document.write sinks in clinic src."

  # ── 3. Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate error code registry
        run: pnpm --filter @workspace/api-server run validate:errors

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/api-server/coverage/
          retention-days: 14

  # ── 4. Security Audit ─────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Security audit (block on critical/high)
        run: pnpm audit --audit-level=high
        # NOTE: if a vulnerability is found in a transitive dependency with no
        # fix available, add it to .pnpmauditignore with documented justification
        # and a review date. Never suppress without explanation.

  # ── 5. Secrets Scan (gitleaks) ────────────────────────────────────────────────
  # Catches accidentally-committed credentials, API keys, .env contents.
  # Free open-source action; no token required.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan past commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 6. Build Verification ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r --if-present run build

      # Emit the deploy tag (short commit SHA) so operators can pin API_IMAGE in
      # .env to a known-good build. See RUNBOOK §10. Only runs on main — PRs do
      # not need a deploy tag.
      - name: Emit deploy tag
        if: github.ref == 'refs/heads/main'
        id: deploy_tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy tag"
            echo ""
            echo "Pin in \`.env\` to deploy this build:"
            echo ""
            echo '```env'
            echo "API_IMAGE=registry/medicore-api:${SHORT_SHA}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 7. Migration Drift Check ──────────────────────────────────────────────────
  # Fails if a schema change was pushed without a corresponding migration file.
  # Runs drizzle-kit generate (no DB needed) and checks whether any new SQL
  # was produced. If the migrations/ directory changed, the schema is ahead of
  # its migration history — the developer must run db:generate and commit.
  migration-drift:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for uncommitted migration drift
        run: |
          pnpm --filter @workspace/db run db:generate
          if ! git diff --quiet lib/db/migrations/; then
            echo "::error::Schema drift detected — run 'pnpm --filter @workspace/db run db:generate' and commit the new migration file."
            git diff --name-only lib/db/migrations/
            exit 1
          fi
          echo "OK — no migration drift."

  # ── 8. Integration tests against a real Postgres ─────────────────────────────
  # Uses testcontainers to spin up postgres:16-alpine inside the runner. Pins the
  # most important guarantee in the system — cross-tenant PHI isolation + doctor
  # scope — against a real DB instead of mocks. Added 2026-05-30 after the board
  # review found that every other integration test mocks @workspace/db, so a
  # forgotten `eq(table.clinicId, …)` filter would pass the 460-test suite.
  # Docker is preinstalled on ubuntu-latest; no extra setup needed.
  integration-db:
    name: Integration Tests (real Postgres)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Pull postgres image up-front (avoids per-test cold pull)
        run: docker pull postgres:16-alpine

      - name: Run integration tests against testcontainers Postgres
        run: pnpm --filter @workspace/api-server run test:integration-db

  # ── 9. Frontend Tests ─────────────────────────────────────────────────────────
  # Vitest + jsdom: pure-logic route-access matrix, i18n key parity (bilingual
  # is a hard product requirement — silent fallbacks are caught here), and
  # Guard render smoke tests. No network — all external hooks are out of scope.
  frontend-test:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run frontend tests
        run: pnpm --filter @workspace/clinic run test

  # ── E2E Tests (Playwright + MSW, AUD-FE-01) ──────────────────────────────────
  # Deliberately advisory, NOT in ci-gate's needs: below. E2E suites are more
  # prone to environment flake than unit tests, and gating merges on that
  # would trade a real regression signal for merge friction. This job still
  # runs on every PR and its report is always uploaded, so failures are
  # visible — they just don't block. No backend/DB is started; every request
  # is intercepted by MSW (artifacts/clinic/src/mocks/handlers.ts) against a
  # real `vite dev` server.
  e2e:
    name: E2E Tests (Playwright, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Playwright browsers (chromium only)
        run: pnpm --filter @workspace/clinic exec playwright install --with-deps chromium

      - name: Run E2E suite
        run: pnpm --filter @workspace/clinic run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: artifacts/clinic/playwright-report/
          retention-days: 14

  # ── 10. Monitoring config validation ─────────────────────────────────────────
  # Promtool parses prometheus-alerts.yml and fails on a malformed alert rule
  # (bad PromQL expr, missing field, bad duration). This is the non-regressable
  # guard for the Phase 6 alert work (ServiceDown / EdgeProbeDown additions): a
  # syntax slip in an alert rule can no longer merge silently. NOTE: promtool
  # validates rule *syntax*, not *delivery* — Alertmanager SMTP delivery (F-P6-5)
  # has no live SMTP in CI and is verified at deploy time per the go-live checklist.
  monitoring-config:
    name: Monitoring Config Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Prometheus alert rules (promtool check rules)
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            --entrypoint promtool prom/prometheus:v2.53.0 \
            check rules prometheus-alerts.yml

  # ── Compose / Dockerfile validation ──────────────────────────────────────────
  # Added after the 2026-07-01 audit found three deploy-blocking defects that
  # nothing mechanically exercised: a healthcheck probing a route that doesn't
  # exist (AUD-OPS-01), a backup script excluded from its own image
  # (AUD-OPS-02), and a missing pg_dump/psql in the backup container
  # (AUD-OPS-03). This job fails the build on the same class of drift.
  compose-validate:
    name: Compose & Dockerfile Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.prod.yml syntax + required env placeholders
        run: |
          docker compose -f docker-compose.prod.yml --env-file .env.prod.example config -q

      - name: Validate docker-compose.yml (dev) syntax
        run: |
          docker compose -f docker-compose.yml config -q

      - name: Hadolint (Dockerfile + Dockerfile.clinic)
        run: |
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile
          docker run --rm -i hadolint/hadolint:v2.12.0 < Dockerfile.clinic

      - name: Healthcheck routes must exist in the app (catches AUD-OPS-01 class)
        run: |
          set -euo pipefail
          # Extract every /api/... path referenced by an api-container healthcheck
          # (localhost:5000 is the api/worker port; Grafana/Prometheus/etc. probe
          # their own bundled endpoints on other ports, so they're excluded by
          # matching the port), then confirm each path is a registered Express
          # route — this is exactly the class of drift AUD-OPS-01 found.
          paths=$(grep -hoE "localhost:5000/api/[a-zA-Z0-9/_-]+" docker-compose*.yml \
            | sed -E 's#.*(/api/[a-zA-Z0-9/_-]+)#\1#' | sort -u)
          if [ -z "$paths" ]; then
            echo "No /api healthchecks found to validate — check the grep pattern."
            exit 1
          fi
          fail=0
          for p in $paths; do
            route="${p#/api}"
            if ! grep -rqE "router\.(get|use)\(\s*[\"']${route}([\"']|/)" artifacts/api-server/src/modules/; then
              echo "FATAL: compose healthcheck targets '$p' but no route '$route' is registered under artifacts/api-server/src/modules/"
              fail=1
            else
              echo "OK: $p is a registered route"
            fi
          done
          exit $fail

  # ── Status gate — all jobs must pass before merge ────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, audit, secrets-scan, build, migration-drift, integration-db, frontend-test, monitoring-config, compose-validate]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.audit.result }}" != "success" ||
                "${{ needs.secrets-scan.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.migration-drift.result }}" != "success" ||
                "${{ needs.integration-db.result }}" != "success" ||
                "${{ needs.frontend-test.result }}" != "success" ||
                "${{ needs.monitoring-config.result }}" != "success" ||
                "${{ needs.compose-validate.result }}" != "success" ]]; then
            echo "CI gate FAILED — one or more jobs did not succeed"
            exit 1
          fi
          echo "CI gate PASSED"
