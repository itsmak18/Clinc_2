name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10"

jobs:
  # ── 1. Typecheck ─────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Typecheck (libs + artifacts)
        run: pnpm run typecheck

  # ── 2. Lint (routes ESLint rule) ─────────────────────────────────────────────
  # Enforces the service-layer boundary: route files must not import @workspace/db
  # or drizzle-orm directly. PR-B1 fixed the two existing violations
  # (inventory.ts and prescriptions.ts) by moving DB access into their service
  # files. The job is now blocking — any regression fails the build.
  lint:
    name: ESLint (routes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run ESLint on routes
        run: pnpm --filter @workspace/api-server run lint

      # Frontend CSRF guard: every mutation in pages must go through Orval's
      # customFetch (which attaches X-CSRF-Token). Hand-written fetch("/api/...")
      # silently drops the header — the same bug as the 2026-05-13 logout
      # regression. PR-C deleted the last 3 apiFetch helpers + 1 raw fetch.
      - name: Block raw fetch("/api/...") in clinic pages
        run: |
          if grep -rnE "fetch\(\s*['\"\`]/api/|fetch\(\s*apiUrl\(" artifacts/clinic/src/pages/ ; then
            echo "::error::Raw fetch to /api/* is forbidden in pages — use the Orval-generated hook."
            exit 1
          fi
          echo "OK — no raw fetch('/api/...') in clinic pages."

      # Pagination guard: CLAUDE.md mandates cursor pagination ("Never use ?offset").
      # The Patients + Appointments endpoints migrated from offset → cursor in the
      # OpenAPI spec; a regression here puts the frontend back on a parameter the
      # backend silently ignores. Audit-logs is the one intentional offset survivor
      # and lives in pages/AuditLog.tsx, so it is excluded.
      - name: Block "offset:" param in clinic pages + components
        run: |
          if grep -rnE "\boffset:\s*[0-9]" artifacts/clinic/src/pages/ artifacts/clinic/src/components/ \
               --exclude=AuditLog.tsx ; then
            echo "::error::offset: pagination is forbidden — use cursor per CLAUDE.md. AuditLog.tsx is the only intentional exception."
            exit 1
          fi
          echo "OK — no offset:N pagination params in clinic pages/components."

  # ── 3. Unit Tests ─────────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate error code registry
        run: pnpm --filter @workspace/api-server run validate:errors

      - name: Run unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: artifacts/api-server/coverage/
          retention-days: 14

  # ── 4. Security Audit ─────────────────────────────────────────────────────────
  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Security audit (block on critical/high)
        run: pnpm audit --audit-level=high
        # NOTE: if a vulnerability is found in a transitive dependency with no
        # fix available, add it to .pnpmauditignore with documented justification
        # and a review date. Never suppress without explanation.

  # ── 5. Secrets Scan (gitleaks) ────────────────────────────────────────────────
  # Catches accidentally-committed credentials, API keys, .env contents.
  # Free open-source action; no token required.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history to scan past commits

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 6. Build Verification ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck, test, audit]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build all packages
        run: pnpm -r --if-present run build

  # ── 7. Migration Drift Check ──────────────────────────────────────────────────
  # Fails if a schema change was pushed without a corresponding migration file.
  # Runs drizzle-kit generate (no DB needed) and checks whether any new SQL
  # was produced. If the migrations/ directory changed, the schema is ahead of
  # its migration history — the developer must run db:generate and commit.
  migration-drift:
    name: Migration Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check for uncommitted migration drift
        run: |
          pnpm --filter @workspace/db run db:generate
          if ! git diff --quiet lib/db/migrations/; then
            echo "::error::Schema drift detected — run 'pnpm --filter @workspace/db run db:generate' and commit the new migration file."
            git diff --name-only lib/db/migrations/
            exit 1
          fi
          echo "OK — no migration drift."

  # ── Status gate — all jobs must pass before merge ────────────────────────────
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [typecheck, lint, test, audit, secrets-scan, build, migration-drift]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.audit.result }}" != "success" ||
                "${{ needs.secrets-scan.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.migration-drift.result }}" != "success" ]]; then
            echo "CI gate FAILED — one or more jobs did not succeed"
            exit 1
          fi
          echo "CI gate PASSED"
