name: Security DAST (ZAP baseline)

# Phase 4.3 of the 2026-05-30 remediation roadmap. Closes the "no DAST" board
# finding by running OWASP ZAP's baseline scan against a deployed staging
# environment. Baseline mode is non-intrusive — passive scan only, no active
# exploitation — so it's safe to run regularly without risking the target.
#
# The scan reports findings as a GitHub issue (by default) AND uploads SARIF
# to the Security tab so they show up alongside CodeQL/Trivy.
#
# Configuration:
#   STAGING_URL (repository variable) — full URL of the staging deploy, e.g.
#     https://staging.medicore.example.com — the scan skips gracefully if unset.
#   .zap/rules.tsv (in-repo) — per-rule severity overrides for known FPs.

on:
  schedule:
    - cron: "0 4 * * *"           # 04:00 UTC nightly
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL (overrides STAGING_URL repo variable)"
        required: false
        type: string

permissions:
  contents: read
  issues: write             # zaproxy/action-baseline opens an issue with findings
  security-events: write    # SARIF upload

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zap-baseline:
    name: OWASP ZAP Baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target URL
        id: target
        run: |
          URL="${{ inputs.target_url || vars.STAGING_URL }}"
          if [ -z "$URL" ]; then
            echo "::warning::Neither inputs.target_url nor STAGING_URL is set — skipping DAST."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "url=$URL" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run ZAP baseline scan
        if: steps.target.outputs.skip != 'true'
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ steps.target.outputs.url }}
          # Per-rule overrides for documented false positives.
          # Format: <rule-id> <action> <comment> — one per line, tab-separated.
          # See: https://www.zaproxy.org/docs/docker/baseline-scan/
          rules_file_name: ".zap/rules.tsv"
          # SARIF output picked up by upload-sarif below.
          cmd_options: "-T 5 -m 5 -a"
          allow_issue_writing: true
          artifact_name: zap-baseline-report

      - name: Upload SARIF to Security tab
        if: steps.target.outputs.skip != 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: report_md.sarif
          category: zap-baseline
