services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-clinic_hub}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clinic_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Database migration (run-once init container) ────────────────────────────
  # Applies versioned Drizzle migrations before the API boots.
  # Exits 0 on success — api waits on this via service_completed_successfully.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build        # re-use the build stage which has drizzle-kit installed
    command: >
      sh -c "pnpm --filter @workspace/db run db:migrate"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clinic_hub}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── API Server ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:       production
      PORT:           "5000"
      DATABASE_URL:   postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-clinic_hub}
      REDIS_URL:      redis://redis:6379
      SESSION_STORE:  redis
      # Required secrets — these MUST be set in the .env file or shell environment.
      # Generate with: node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      # SESSION_SECRET is the JWT signing key (lib/jwt-secret.ts:1). The legacy
      # JWT_SECRET env var was removed in the A10 cleanup — code never read it.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required — set it in .env}
      METRICS_TOKEN:  ${METRICS_TOKEN:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      DB_POOL_MAX:    ${DB_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "5000:5000"
    stop_grace_period: 35s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Clinic Frontend (nginx) ──────────────────────────────────────────────────
  clinic:
    build:
      context: .
      dockerfile: Dockerfile.clinic
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
