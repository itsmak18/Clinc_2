# Alertmanager — email receiver (chosen 2026-05-31).
# SMTP credentials are pulled from environment variables interpolated at
# container start (see docker-compose.prod.yml `environment:` block on
# the alertmanager service). Required vars:
#   SMTP_SMARTHOST   — e.g. smtp.gmail.com:587
#   SMTP_FROM        — sender, e.g. medicore-alerts@yourdomain
#   SMTP_AUTH_USER   — SMTP username
#   SMTP_AUTH_PASS   — SMTP password / app token
#   ALERT_EMAIL_TO   — destination, e.g. ops@yourdomain
#
# To switch SMTP providers (Gmail, SES, Mailgun, Postmark) update the
# env block — no Alertmanager config edit required.

global:
  resolve_timeout: 5m
  smtp_smarthost: "${SMTP_SMARTHOST}"
  smtp_from: "${SMTP_FROM}"
  smtp_auth_username: "${SMTP_AUTH_USER}"
  smtp_auth_password: "${SMTP_AUTH_PASS}"
  smtp_require_tls: true

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: "default"
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
        headers:
          Subject: "[MediCore {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"

  - name: "critical"
    email_configs:
      - to: "${ALERT_EMAIL_TO}"
        send_resolved: true
        headers:
          Subject: "[MediCore CRITICAL {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
