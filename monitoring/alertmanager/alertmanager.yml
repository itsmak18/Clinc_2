# Alertmanager — email receiver (chosen 2026-05-31).
#
# IMPORTANT (F-P6-5, 2026-06-07): Alertmanager does NOT expand ${VAR} in this
# config file — env-var interpolation is an explicitly-declined upstream feature
# (prometheus/alertmanager#2818). The previous `${SMTP_*}` form was therefore
# inert: smtp_smarthost was the literal string "${SMTP_SMARTHOST}" and NO alert
# email was ever delivered. Non-secret fields are now hardcoded; the only secret
# (the SMTP password) is read from a Docker secret via smtp_auth_password_file.
#
# OPERATOR: edit the four non-secret values below to match your mail provider,
# and write the SMTP password/app-token to ./secrets/smtp_auth_password (mode
# 0600). To switch providers, edit this file (no .env change). After deploy,
# verify delivery end-to-end:
#   docker compose -f docker-compose.prod.yml exec alertmanager \
#     amtool alert add test severity=critical --alertmanager.url=http://localhost:9093
#   …and confirm the email lands in ALERT_EMAIL_TO's inbox.

global:
  resolve_timeout: 5m
  smtp_smarthost: "smtp.example.com:587"          # OPERATOR: e.g. smtp.gmail.com:587
  smtp_from: "medicore-alerts@clinic.local"        # OPERATOR: sender address
  smtp_auth_username: "medicore-alerts"            # OPERATOR: SMTP username
  smtp_auth_password_file: /run/secrets/smtp_auth_password  # ./secrets/smtp_auth_password (mode 0600)
  smtp_require_tls: true

route:
  receiver: "default"
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        severity: critical
      receiver: "critical"
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: "default"
    email_configs:
      - to: "oncall@clinic.local"   # OPERATOR: destination inbox
        send_resolved: true
        headers:
          Subject: "[MediCore {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"

  - name: "critical"
    email_configs:
      - to: "oncall@clinic.local"   # OPERATOR: destination inbox
        send_resolved: true
        headers:
          Subject: "[MediCore CRITICAL {{ .Status | toUpper }}] {{ .CommonLabels.alertname }}"

inhibit_rules:
  - source_match:
      severity: "critical"
    target_match:
      severity: "warning"
    equal: ["alertname"]
