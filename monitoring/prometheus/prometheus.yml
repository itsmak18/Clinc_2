global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # MediCore API — /metrics requires Bearer auth (METRICS_TOKEN).
  # Prometheus reads the token from the metrics_token Docker secret.
  - job_name: "medicore-api"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:5000"]
    scrape_interval: 10s

  - job_name: "medicore-worker"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["worker:5001"]
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Redis — session store, rate-limit state, SSE Pub/Sub, doctor scope cache.
  # Requires redis_exporter service in docker-compose.prod.yml.
  # Unlocks: RedisHighMemory alert.
  - job_name: "redis"
    static_configs:
      - targets: ["redis_exporter:9121"]

  # Host OS — disk, CPU, memory, network.
  # Requires node_exporter service in docker-compose.prod.yml.
  # Unlocks: DiskSpaceCritical alert.
  # Also exposes the backup textfile metric (backup.prom written by backup container).
  # Unlocks: BackupStale + BackupMissingTextfile alerts.
  - job_name: "node"
    static_configs:
      - targets: ["node_exporter:9100"]

  # TLS + edge availability probe against the public/edge endpoint.
  # blackbox_exporter is deployed in docker-compose.prod.yml.
  # Unlocks: SSLCertificateExpiringSoon + EdgeProbeDown alerts.
  #
  # F-P6-7 (2026-06-07): Prometheus does NOT env-expand its config file
  # (prometheus/prometheus#2357), so the old "${BLACKBOX_TARGET}" was a literal
  # target and these probes never had a real series. OPERATOR: replace the target
  # below with your edge URL (e.g. https://clinic.yourdomain.local). Editing this
  # file requires a Prometheus reload: `... exec prometheus wget -qO- --post-data=''
  # http://localhost:9090/-/reload`.
  - job_name: "blackbox-tls"
    metrics_path: /probe
    params:
      module: [https_2xx]
    static_configs:
      - targets:
          - "https://clinic.yourdomain.local"   # OPERATOR: set to your edge URL
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox_exporter:9115
