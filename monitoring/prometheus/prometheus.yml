global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # MediCore API — /metrics requires Bearer auth (METRICS_TOKEN).
  # Prometheus reads the token from the metrics_token Docker secret.
  - job_name: "medicore-api"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:5000"]
    scrape_interval: 10s

  - job_name: "medicore-worker"
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["worker:5001"]
    scrape_interval: 10s

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Backup freshness — node_exporter textfile collector reads
  # backup.prom written by the backup container after each successful run.
  # Enabled once node_exporter is provisioned (see prometheus-alerts.yml).
